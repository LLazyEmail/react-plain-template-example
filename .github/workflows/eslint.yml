# ESLint code scanning for the maintained package in 1.4/. Lint findings are
# uploaded as SARIF to Security -> Code scanning; they don't fail the job.

name: ESLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '33 0 * * 5'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: 1.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 1.4/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        run: npx eslint . -c ./eslintrc.js --ext .js
          --ignore-path ./.eslintignore
          --resolve-plugins-relative-to .
          --format @microsoft/eslint-formatter-sarif
          --output-file ../eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
