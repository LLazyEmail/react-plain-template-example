# Clean install, build and test of the maintained package in 1.4/ across
# supported Node versions. The repo root has no package.json, so every step
# runs inside 1.4/ (see "CI / GitHub Actions" in the README).

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.4

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 1.4/package-lock.json
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
